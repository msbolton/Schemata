syntax = "proto3";

package shop.orders;

import "google/protobuf/empty.proto";
import "shop/catalog.proto";

message OrderId {
  string id = 1;  // schemata: uuid
}

message ListOrders {
  optional Status status = 1;
  int32 limit = 2;  // schemata: int32(min = 1, max = 200); default = 50
}

message PlaceOrder {
  string customer_id = 1;  // schemata: uuid
  repeated Order.Line lines = 2;  // schemata: list<Line>(min = 1)
}

message Order {
  string id = 1;  // schemata: uuid
  Status status = 2;
  repeated Line lines = 3;
  .shop.catalog.Money total = 4;

  message Line {
    string sku = 1;  // schemata: string(max = 64)
    int32 quantity = 2;  // schemata: int32(min = 1)
  }
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_PENDING = 1;
  STATUS_PAID = 2;
  STATUS_SHIPPED = 3;
  STATUS_CANCELLED = 4;
}

message Chunk {
  bytes bytes = 1;
}

message Receipt {
  int64 count = 1;
}

// Place and read orders.
service Orders {
  // Fetch one order.
  rpc Get(OrderId) returns (Order);  // schemata: get "/orders/{id}"
  // Orders matching a filter, newest first.
  rpc List(ListOrders) returns (stream Order);  // schemata: get "/orders"
  rpc Place(PlaceOrder) returns (Order);  // schemata: post "/orders"
  rpc Cancel(OrderId) returns (google.protobuf.Empty);  // schemata: delete "/orders/{id}"
  rpc Upload(stream Chunk) returns (Receipt);
  // schemata: reserved #6, "archive"
}
