syntax = "proto3";

package ledger.journal.v1;

import "ledger/accounts.proto";

enum Source {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_MANUAL = 1;
  SOURCE_IMPORTED = 2;
  SOURCE_ACCRUAL = 3;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_DEBIT = 1;
  SIDE_CREDIT = 2;
}

message Invoice {
  string number = 1;  // schemata: string(max = 32)
}

message Payment {
  string reference = 1;  // schemata: string(max = 64)
}

// What an entry refers back to; a bare source when nothing else applies.
message Reference {
  oneof kind {
    Invoice invoice = 1;
    Payment payment = 2;
    Source source = 3;
  }
}

// A balanced entry: at least two lines.
message Entry {
  string id = 1;  // schemata: uuid
  string posted = 2;  // schemata: date
  optional string memo = 3;  // schemata: string(max = 500)?
  repeated Line lines = 4;  // schemata: list<Line>(min = 2)
  Reference ref = 5;

  message Line {
    .ledger.accounts.v1.Account account = 1;
    string amount = 2;  // schemata: decimal(19, 4)
    Side side = 3;
  }

  reserved 6;
}
