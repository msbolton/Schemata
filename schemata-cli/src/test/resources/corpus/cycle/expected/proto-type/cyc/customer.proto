syntax = "proto3";

package cyc;

import "cyc/cyc_beta_note.proto";
import "cyc/note.proto";

// An order that points at its customer.
message Order {
  int64 id = 1;
  Customer customer = 2;
  Note note = 3;
}

message Customer {
  string name = 1;
  repeated Order orders = 2;
  CycBetaNote note = 3;  // schemata: CycBetaNote?
}
