syntax = "proto3";

package corpus.layout.v1;

import "google/protobuf/empty.proto";

option java_package = "com.example.corpus.layout";
option java_multiple_files = true;

// A customer and the last order they placed.
message Customer {
  string id = 1;
  Order last = 2;  // schemata: Order?
}

// An order and the customer who placed it.
message Order {
  string id = 1;
  Customer customer = 2;
  Status status = 3;
  Tag label = 4;
  SeatKey seat = 5;
}

// A seat an order reserves.
message Seat {
  int32 row = 1;
  int32 number = 2;
}

message SeatKey {
  int32 row = 1;
  int32 number = 2;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_PLACED = 1;
  STATUS_SHIPPED = 2;
}

message Tag {
  string text = 1;
}

service Orders {
  rpc Get(Order) returns (Order);
  rpc Cancel(Order) returns (.google.protobuf.Empty);
}
