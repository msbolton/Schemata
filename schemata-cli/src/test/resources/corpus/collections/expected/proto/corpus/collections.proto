syntax = "proto3";

package corpus.collections;

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
  COLOR_GREEN = 2;
}

message Item {
  string name = 1;
}

message Collections {
  repeated string tags = 1;
  repeated Item items = 2;
  repeated Color colors = 3;
  repeated string maybe = 4;  // schemata: list<string>?
  repeated string holes = 5;  // schemata: list<string?>
  map<string, int32> counts = 6;
  map<int64, Item> by_id = 7;
  map<string, int32> sparse = 8;  // schemata: map<string, int32?>
  repeated string limited = 9;  // schemata: list<string(max = 3)>(max = 2)
}
