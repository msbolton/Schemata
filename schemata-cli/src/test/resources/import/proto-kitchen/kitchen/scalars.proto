syntax = "proto3";

package kitchen.scalars;

// Every scalar, and the notes the target writes.
message Scalars {
  double d = 1;
  float f = 2;
  int32 i32 = 3;
  int64 i64 = 4;
  uint32 u32 = 5;
  uint64 u64 = 6;
  sint32 s32 = 7;
  sint64 s64 = 8;
  fixed32 f32 = 9;
  fixed64 f64 = 10;
  sfixed32 sf32 = 11;
  sfixed64 sf64 = 12;
  bool b = 13;
  string s = 14;
  bytes raw = 15;
  optional string maybe = 16;
  string id = 17;  // schemata: uuid
  string amount = 18;  // schemata: decimal(19, 4)
  int32 broken = 19;  // schemata: uuid
  string unreadable = 20;  // schemata: string(
  string code = 21;  // schemata: string(pattern = "^a; b$"); default = "a; b"
}
