name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :schemata-cli:shadowJar check --no-daemon -Pschemata.requireV1Jar=true
      - uses: actions/upload-artifact@v4
        with:
          name: schemata-jar
          path: schemata-cli/build/libs/schemata-[0-9]*.jar
          if-no-files-found: error

  native:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
      - uses: gradle/actions/setup-gradle@v4
      # The GraalVM plugin's resource-config task cannot be configuration-cached.
      - name: Build the jar and the binary
        run: ./gradlew :schemata-cli:shadowJar :schemata-cli:nativeCompile --no-daemon --no-configuration-cache
      - name: Verify the binary against the jar
        run: |
          ./gradlew :schemata-cli:test --tests 'io.schemata.cli.NativeImageTest' \
            -Pschemata.nativeBinary=schemata-cli/build/native/nativeCompile/schemata \
            --no-daemon --no-configuration-cache
