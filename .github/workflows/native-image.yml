name: native-image spike

on:
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          components: 'native-image'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :schemata-cli:shadowJar --no-daemon
      - name: Build the native image
        run: |
          jar=$(ls schemata-cli/build/libs/schemata-[0-9]*.jar)
          native-image --no-fallback -jar "$jar" schemata
          ls -la schemata
      - name: Install GNU time
        run: sudo apt-get update -qq && sudo apt-get install -y -qq time
      - name: Run the worked example
        run: |
          set +e
          set +o pipefail
          ./schemata check schemata-cli/src/test/resources/corpus/worked-example; echo "check exit=$?"
          ./schemata compile --format json --out /tmp/out schemata-cli/src/test/resources/corpus/worked-example > /tmp/report.json; echo "compile exit=$?"
          head -c 300 /tmp/report.json
          /usr/bin/time -v ./schemata check schemata-cli/src/test/resources/corpus/worked-example 2> time-native.txt >/dev/null; grep -E 'Elapsed|Maximum resident' time-native.txt
          /usr/bin/time -v java -jar schemata-cli/build/libs/schemata-[0-9]*.jar check schemata-cli/src/test/resources/corpus/worked-example 2> time-jar.txt >/dev/null; grep -E 'Elapsed|Maximum resident' time-jar.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: schemata-native-linux-x64
          path: schemata
