name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - name: Check the built version matches the tag
        if: github.ref_type == 'tag'
        run: ls schemata-cli/build/libs/schemata-"${GITHUB_REF_NAME#v}".jar
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: schemata-cli/build/libs/schemata-[0-9]*.jar
          if-no-files-found: error

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64,   os: ubuntu-latest }
          - { target: macos-arm64, os: macos-15 }
          - { target: macos-x64,   os: macos-15-intel }
          - { target: windows-x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the jar and the binary
        run: ./gradlew :schemata-cli:shadowJar :schemata-cli:nativeCompile --no-daemon
        shell: bash
      - name: Verify the binary against the jar
        run: |
          binary=schemata-cli/build/native/nativeCompile/schemata
          if [ "${{ runner.os }}" = "Windows" ]; then binary="$binary.exe"; fi
          ./gradlew :schemata-cli:test --tests 'io.schemata.cli.NativeImageTest' \
            -Pschemata.nativeBinary="$binary" --no-daemon
        shell: bash
      - name: Package
        id: package
        run: |
          version=$(ls schemata-cli/build/libs/schemata-[0-9]*.jar | sed -E 's|.*/schemata-(.*)\.jar|\1|')
          cd schemata-cli/build/native/nativeCompile
          if [ "${{ runner.os }}" = "Windows" ]; then
            asset="schemata-$version-${{ matrix.target }}.zip"
            7z a "$asset" schemata.exe > /dev/null
          else
            asset="schemata-$version-${{ matrix.target }}.tar.gz"
            tar -czf "$asset" schemata
          fi
          echo "asset=schemata-cli/build/native/nativeCompile/$asset" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [jar, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: assets/*
